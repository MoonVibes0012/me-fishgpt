<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>me fishgpt</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Quicksand', system-ui, sans-serif;
      background: #020b18;
      color: #e0f7fa;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    #particles {
      position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute; width: 4px; height: 4px;
      background: rgba(128, 222, 234, 0.4); border-radius: 50%;
      box-shadow: 0 0 6px #80deea;
      animation: floatParticle linear infinite;
    }
    @keyframes floatParticle {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
    body::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      pointer-events: none; z-index: 2;
    }
    .app {
      width: 100%; max-width: 480px; height: 100%; max-height: 840px;
      display: flex; flex-direction: column;
      padding: 16px; position: relative; z-index: 10;
    }
    h1 {
      font-size: 1.55rem; font-weight: 600; letter-spacing: 5px;
      text-align: center; color: #80deea;
      text-shadow: 0 0 10px #80deea, 0 0 30px #00acc1, 0 0 60px #006064;
      animation: neonPulse 3s ease-in-out infinite;
      margin-bottom: 4px;
    }
    @keyframes neonPulse {
      0%, 100% { text-shadow: 0 0 10px #80deea, 0 0 30px #00acc1, 0 0 60px #006064; }
      50% { text-shadow: 0 0 20px #80deea, 0 0 50px #00acc1, 0 0 80px #006064; }
    }
    h1::after {
      content: ''; display: block; width: 58px; height: 2px; margin: 6px auto 0;
      background: linear-gradient(90deg, transparent, #80deea, #00acc1, transparent);
      animation: lineGlow 2s ease-in-out infinite;
    }
    @keyframes lineGlow {
      0%, 100% { opacity: 0.4; transform: scaleX(0.8); }
      50% { opacity: 1; transform: scaleX(1); }
    }
    #chat {
      width: 100%; flex: 1; min-height: 180px; max-height: 460px;
      border-radius: 18px; padding: 14px; overflow-y: auto; margin: 10px 0;
      position: relative; word-wrap: break-word; white-space: pre-wrap;
      background-image:
        linear-gradient(rgba(8,28,48,0.84), rgba(8,28,48,0.84)),
        url('Screenshot_20260821-130756_Brave.png');
      background-size: cover; background-position: center;
      box-shadow: 0 10px 36px rgba(0,0,0,0.6);
      border: 1.5px solid transparent;
      animation: borderGlow 4s linear infinite;
    }
    @keyframes borderGlow {
      0% { border-color: rgba(128,222,234,0.2); }
      50% { border-color: rgba(128,222,234,0.55); box-shadow: 0 0 28px rgba(128,222,234,0.22); }
      100% { border-color: rgba(128,222,234,0.2); }
    }
    #chat:empty::before {
      content: 'Kedalaman menunggu bisikanmu...';
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(128,222,234,0.35); font-size: 0.95rem;
      animation: fadePulse 3s ease-in-out infinite;
    }
    @keyframes fadePulse {
      0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; }
    }
    .msg { margin-bottom: 10px; line-height: 1.5; max-width: 88%; font-size: 0.96rem; }
    .user { color: #90caf9; margin-left: auto; text-align: right; }
    .bot { color: #80deea; text-shadow: 0 0 8px rgba(128,222,234,0.4); }
    .bot.special { color: #f0abfc; text-shadow: 0 0 12px rgba(240,171,252,0.6); }
    .bot.learned { color: #a5f3fc; text-shadow: 0 0 12px rgba(165,243,252,0.5); }
    .bot.command { color: #80cbc4; }

    .input-area { width: 100%; display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-end; }
    .input-area textarea {
      flex: 1; padding: 12px 14px; border: 1px solid rgba(128,222,234,0.25);
      border-radius: 12px; background: rgba(10,35,55,0.7); color: #e0f7fa;
      font-size: 1rem; font-family: inherit; outline: none; resize: none;
      min-height: 46px; max-height: 110px; line-height: 1.4;
    }
    .input-area textarea:focus { border-color: #80deea; box-shadow: 0 0 18px rgba(128,222,234,0.2); }

    #btnKirim {
      padding: 12px 16px; background: linear-gradient(135deg, #006064, #00acc1);
      color: white; border: none; border-radius: 12px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; height: 46px; position: relative; overflow: hidden;
    }
    .ripple {
      position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35);
      transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    .upload-area { width: 100%; display: flex; gap: 8px; margin-top: 4px; }
    .upload-area label {
      flex: 1; padding: 8px; text-align: center;
      border: 1px dashed rgba(128,222,234,0.35); border-radius: 10px;
      color: rgba(128,222,234,0.75); font-size: 0.8rem; cursor: pointer;
    }
    .upload-area input { display: none; }

    .bottom-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 8px; flex-wrap: wrap;
    }
    #status { font-size: 0.76rem; color: rgba(128,222,234,0.55); flex: 1; }
    #status.online { color: #81c784; }
    #status.offline { color: #ef9a9a; }

    .btn-small {
      padding: 5px 10px; border-radius: 7px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; border: 1px solid transparent; font-family: inherit;
    }
    #btnResetKnowledge {
      background: rgba(255,60,60,0.18); color: #ff8a80; border-color: rgba(255,60,60,0.3);
    }
    #btnResetCommands {
      background: rgba(255,180,0,0.15); color: #ffd54f; border-color: rgba(255,180,0,0.3);
    }
  </style>
</head>
<body>
  <div id="particles"></div>

  <div class="app">
    <h1>me fishgpt</h1>
    <div id="chat"></div>

    <div class="input-area">
      <textarea id="input" placeholder="Bisikkan sesuatu..." rows="1"></textarea>
      <button id="btnKirim">Kirim</button>
    </div>

    <div class="upload-area">
      <label>+ Pengetahuan (.txt)<input type="file" id="fileInput" accept=".txt" /></label>
      <label>+ Perintah (.json)<input type="file" id="jsonInput" accept=".json,.txt" /></label>
    </div>

    <div class="bottom-row">
      <div id="status">Menunggu koneksi...</div>
      <button class="btn-small" id="btnResetCommands">Reset Perintah</button>
      <button class="btn-small" id="btnResetKnowledge">Reset Pengetahuan</button>
    </div>
  </div>

  <script>
    const API = 'https://me-fishgpt-production.up.railway.app';

    // ===== DEFAULT COMMANDS =====
    const DEFAULT_COMMANDS = {
      version: "2.1",
      name: "Fishgpt Default",
      commands: [
        {
          category: "sapaan",
          triggers: ["halo", "hai", "hi", "hey", "hello", "pagi", "siang", "sore", "malam", "selamat pagi", "selamat siang", "selamat sore", "selamat malam"],
          responses: {
            pagi: "pagi... saya fishgpt",
            siang: "siang. saya fishgpt",
            sore: "sore. kedalaman mulai gelap",
            malam: "malam. saya fishgpt dari bawah laut",
            default: "saya fishgpt"
          }
        },
        {
          category: "identitas",
          triggers: ["siapa kamu", "kamu siapa", "nama kamu", "kamu apa"],
          response: "saya fishgpt. makhluk dari kedalaman"
        },
        {
          category: "kabar",
          triggers: ["apa kabar", "gimana kabar", "kabarmu"],
          response: "tenang. arus sedang pelan hari ini"
        },
        {
          category: "terima kasih",
          triggers: ["terima kasih", "makasih", "thanks"],
          response: "sama-sama..."
        },
        {
          category: "cinta",
          triggers: ["love", "cinta", "sayang", "rindu"],
          response: "di laut, perasaan ikut arus"
        },
        {
          category: "sedih",
          triggers: ["sedih", "capek", "lelah", "galau"],
          response: "tenggelam sejenak boleh. laut menerimamu"
        },
        {
          category: "senang",
          triggers: ["senang", "bahagia", "happy"],
          response: "bagus. biarkan itu mengapung"
        },
        {
          category: "belajar",
          triggers: ["belajar", "ajari", "pengetahuan"],
          response: "kirimkan file. aku akan mengingatnya"
        },
        {
          category: "afirmasi",
          triggers: ["ok", "oke", "baik", "sip", "ya"],
          response: "baik"
        },
        {
          category: "perpisahan",
          triggers: ["bye", "dadah", "selamat tinggal", "sampai jumpa"],
          response: "sampai bertemu di arus berikutnya"
        }
      ],
      special_responses: [
        { trigger: "random", response: "i'm gpt by VelvetEcho ON MoonVibes" }
      ],
      fallback: "me fishgpt"
    };

    // Load dari localStorage
    let COMMANDS = JSON.parse(localStorage.getItem('fishgpt_commands')) || structuredClone(DEFAULT_COMMANDS);

    function simpanPerintah() {
      localStorage.setItem('fishgpt_commands', JSON.stringify(COMMANDS));
    }

    // ===== DOM =====
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const btn = document.getElementById('btnKirim');
    const fileInput = document.getElementById('fileInput');
    const jsonInput = document.getElementById('jsonInput');
    const status = document.getElementById('status');
    const btnResetKnowledge = document.getElementById('btnResetKnowledge');
    const btnResetCommands = document.getElementById('btnResetCommands');

    // ===== PARTIKEL =====
    (function () {
      const container = document.getElementById('particles');
      for (let i = 0; i < 26; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = p.style.height = (2 + Math.random() * 3.5) + 'px';
        p.style.animationDuration = (11 + Math.random() * 16) + 's';
        p.style.animationDelay = Math.random() * 12 + 's';
        container.appendChild(p);
      }
    })();

    // ===== AUDIO =====
    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTypeSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 620 + Math.random() * 150;
      osc.type = 'triangle';
      gain.gain.value = 0.028;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }
    function playKeySound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 780 + Math.random() * 350;
      osc.type = 'square';
      gain.gain.value = 0.015;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.035);
    }
    input.addEventListener('keydown', () => {
      initAudio();
      playKeySound();
    });

    // ===== RIPPLE =====
    btn.addEventListener('click', function (e) {
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });

    // ===== AUTO RESIZE =====
    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 110) + 'px';
    }
    input.addEventListener('input', autoResize);

    // ===== STATUS =====
    async function updateStatus() {
      try {
        const res = await fetch(API + '/knowledge/count');
        const data = await res.json();
        status.textContent = `Pengetahuan: ${data.count} | Perintah: ${COMMANDS.commands.length}`;
        status.className = 'online';
      } catch {
        status.textContent = 'Backend offline';
        status.className = 'offline';
      }
    }
    updateStatus();

    // ===== LOAD JSON + STACK (MERGE) =====
    jsonInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const json = JSON.parse(text);

        if (!json.commands || !Array.isArray(json.commands)) {
          alert('Format JSON tidak valid. Harus ada properti "commands" (array).');
          return;
        }

        // STACK / MERGE
        const existingCategories = new Set(COMMANDS.commands.map(c => c.category));
        let added = 0;

        json.commands.forEach(newCmd => {
          // Jika category sudah ada, kita tetap tambahkan (stack)
          COMMANDS.commands.push(newCmd);
          added++;
        });

        // Merge special responses juga
        if (json.special_responses && Array.isArray(json.special_responses)) {
          COMMANDS.special_responses = COMMANDS.special_responses || [];
          COMMANDS.special_responses.push(...json.special_responses);
        }

        if (json.fallback) {
          COMMANDS.fallback = json.fallback;
        }

        simpanPerintah();
        status.textContent = `Berhasil menambah ${added} perintah. Total sekarang: ${COMMANDS.commands.length}`;
        status.className = 'online';
      } catch (err) {
        alert('Gagal membaca JSON: ' + err.message);
      }
      jsonInput.value = '';
    });

    // ===== UPLOAD PENGETAHUAN =====
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      status.textContent = 'Mengunggah pengetahuan...';
      const formData = new FormData();
      formData.append('file', file);
      try {
        const res = await fetch(API + '/upload', { method: 'POST', body: formData });
        const data = await res.json();
        status.textContent = res.ok ? data.message : (data.error || 'Gagal');
        if (res.ok) updateStatus();
      } catch {
        status.textContent = 'Gagal terhubung';
        status.className = 'offline';
      }
      fileInput.value = '';
    });

    // ===== RESET PENGETAHUAN (SERVER) =====
    btnResetKnowledge.addEventListener('click', async () => {
      if (!confirm('Yakin hapus SEMUA pengetahuan dari server?')) return;
      try {
        const res = await fetch(API + '/knowledge/reset', { method: 'DELETE' });
        const data = await res.json();
        status.textContent = res.ok ? 'Pengetahuan berhasil direset' : (data.error || 'Gagal');
        if (res.ok) updateStatus();
      } catch {
        status.textContent = 'Gagal terhubung';
      }
    });

    // ===== RESET PERINTAH (LOCAL) =====
    btnResetCommands.addEventListener('click', () => {
      if (!confirm('Yakin kembalikan perintah ke default? Semua JSON yang ditumpuk akan hilang.')) return;
      COMMANDS = structuredClone(DEFAULT_COMMANDS);
      simpanPerintah();
      status.textContent = `Perintah dikembalikan ke default (${COMMANDS.commands.length} kategori)`;
      status.className = 'online';
    });

    // ===== KETIK EFEK =====
    function ketik(teks, elemen) {
      let i = 0;
      elemen.textContent = '';
      function step() {
        if (i < teks.length) {
          elemen.textContent += teks[i];
          playTypeSound();
          i++;
          chat.scrollTop = chat.scrollHeight;
          setTimeout(step, 40);
        }
      }
      step();
    }

    // ===== ENGINE PERINTAH (lebih rapi) =====
    function jalankanPerintah(pesan) {
      const p = pesan.toLowerCase().trim();
      const jam = new Date().getHours();

      for (const cmd of COMMANDS.commands) {
        const cocok = cmd.triggers.some(t => p.includes(t.toLowerCase()));
        if (!cocok) continue;

        // Handle responses berdasarkan waktu (khusus sapaan)
        if (cmd.responses) {
          if (p.includes('pagi') || (cmd.category === 'sapaan' && jam >= 5 && jam < 11)) {
            return cmd.responses.pagi || cmd.responses.default;
          }
          if (p.includes('siang') || (cmd.category === 'sapaan' && jam >= 11 && jam < 15)) {
            return cmd.responses.siang || cmd.responses.default;
          }
          if (p.includes('sore') || (cmd.category === 'sapaan' && jam >= 15 && jam < 18)) {
            return cmd.responses.sore || cmd.responses.default;
          }
          if (p.includes('malam') || (cmd.category === 'sapaan' && (jam >= 18 || jam < 5))) {
            return cmd.responses.malam || cmd.responses.default;
          }
          return cmd.responses.default || Object.values(cmd.responses)[0];
        }

        if (cmd.response) return cmd.response;
      }
      return null;
    }

    // ===== PILIH JAWABAN =====
    async function pilihJawaban(pesanUser) {
      // 1. Perintah JSON
      const dariPerintah = jalankanPerintah(pesanUser);
      if (dariPerintah) return { text: dariPerintah, type: 'command' };

      // 2. Special jarang
      if (Math.random() < 0.035) {
        return { text: "i'm gpt by VelvetEcho ON MoonVibes", type: 'special' };
      }

      // 3. Pengetahuan
      try {
        const res = await fetch(API + '/knowledge/random');
        const data = await res.json();
        if (data.content) return { text: data.content, type: 'learned' };
      } catch {}

      // 4. Fallback
      return { text: COMMANDS.fallback || 'me fishgpt', type: 'normal' };
    }

    // ===== KIRIM =====
    async function kirim() {
      const pesan = input.value.trim();
      if (!pesan) return;

      initAudio();

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.textContent = 'Kamu: ' + pesan;
      chat.appendChild(userDiv);
      chat.scrollTop = chat.scrollHeight;

      input.value = '';
      input.style.height = '46px';

      const botDiv = document.createElement('div');
      botDiv.className = 'msg bot';
      chat.appendChild(botDiv);

      const jawaban = await pilihJawaban(pesan);
      if (jawaban.type === 'special') botDiv.classList.add('special');
      if (jawaban.type === 'learned') botDiv.classList.add('learned');
      if (jawaban.type === 'command') botDiv.classList.add('command');

      ketik(jawaban.text, botDiv);
    }

    btn.addEventListener('click', kirim);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        kirim();
      }
    });

    setTimeout(autoResize, 60);
  </script>
</body>
</html>
