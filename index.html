<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>me fishgpt</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Quicksand', system-ui, sans-serif;
      background: #020b18; color: #e0f7fa;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    #particles {
      position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute; border-radius: 50%;
      background: rgba(128, 222, 234, 0.4); box-shadow: 0 0 6px #80deea;
      animation: floatParticle linear infinite;
    }
    @keyframes floatParticle {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10% { opacity: 1; } 90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
    body::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      pointer-events: none; z-index: 2;
    }
    .app {
      width: 100%; max-width: 480px; height: 100%; max-height: 860px;
      display: flex; flex-direction: column; padding: 14px;
      position: relative; z-index: 10;
    }
    h1 {
      font-size: 1.5rem; font-weight: 600; letter-spacing: 5px;
      text-align: center; color: #80deea;
      text-shadow: 0 0 10px #80deea, 0 0 30px #00acc1;
      animation: neonPulse 3s ease-in-out infinite; margin-bottom: 2px;
    }
    @keyframes neonPulse {
      0%, 100% { text-shadow: 0 0 10px #80deea, 0 0 30px #00acc1; }
      50% { text-shadow: 0 0 20px #80deea, 0 0 50px #00acc1; }
    }
    #chat {
      width: 100%; flex: 1; min-height: 160px; max-height: 420px;
      border-radius: 16px; padding: 12px; overflow-y: auto; margin: 8px 0;
      position: relative; word-wrap: break-word; white-space: pre-wrap;
      background-image: linear-gradient(rgba(8,28,48,0.85), rgba(8,28,48,0.85)),
                        url('Screenshot_20260821-130756_Brave.png');
      background-size: cover; background-position: center;
      border: 1.5px solid rgba(128,222,234,0.25);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #chat:empty::before {
      content: 'Kedalaman menunggu bisikanmu...';
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(128,222,234,0.35); font-size: 0.9rem;
    }
    .msg { margin-bottom: 9px; line-height: 1.45; max-width: 88%; font-size: 0.95rem; }
    .user { color: #90caf9; margin-left: auto; text-align: right; }
    .bot { color: #80deea; }
    .bot.special { color: #80cbc4; }
    .bot.learned { color: #a5f3fc; }
    .bot.command { color: #4dd0e1; }

    .input-area { display: flex; gap: 8px; margin-bottom: 6px; align-items: flex-end; }
    .input-area textarea {
      flex: 1; padding: 11px 13px; border: 1px solid rgba(128,222,234,0.25);
      border-radius: 11px; background: rgba(10,35,55,0.75); color: #e0f7fa;
      font-size: 0.95rem; font-family: inherit; outline: none; resize: none;
      min-height: 44px; max-height: 100px;
    }
    #btnKirim {
      padding: 11px 15px; background: linear-gradient(135deg, #006064, #00acc1);
      color: white; border: none; border-radius: 11px; font-weight: 600;
      height: 44px; cursor: pointer; position: relative; overflow: hidden;
    }
    .ripple {
      position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35);
      transform: scale(0); animation: rippleAnim 0.55s linear; pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    .upload-area { display: flex; gap: 7px; margin-top: 2px; }
    .upload-area label {
      flex: 1; padding: 7px; text-align: center; font-size: 0.78rem;
      border: 1px dashed rgba(128,222,234,0.35); border-radius: 9px;
      color: rgba(128,222,234,0.75); cursor: pointer;
    }
    .upload-area input { display: none; }

    .bottom-row {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px;
      align-items: center; justify-content: space-between;
    }
    #status { font-size: 0.73rem; color: rgba(128,222,234,0.55); flex: 1; min-width: 120px; }
    #status.online { color: #81c784; }
    #status.offline { color: #ef9a9a; }

    .btn-small {
      padding: 5px 9px; border-radius: 6px; font-size: 0.72rem; font-weight: 600;
      cursor: pointer; border: 1px solid transparent; font-family: inherit;
    }
    #btnLihat { background: rgba(0,172,193,0.15); color: #80deea; border-color: rgba(0,172,193,0.3); }
    #btnResetCommands { background: rgba(255,180,0,0.12); color: #ffd54f; border-color: rgba(255,180,0,0.3); }
    #btnResetKnowledge { background: rgba(255,60,60,0.15); color: #ff8a80; border-color: rgba(255,60,60,0.3); }

    #modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    #modal.active { display: flex; }
    .modal-content {
      background: #0a1e32; border: 1px solid rgba(128,222,234,0.3);
      border-radius: 14px; width: 100%; max-width: 420px; max-height: 80vh;
      overflow-y: auto; padding: 16px;
    }
    .modal-content h3 { color: #80deea; margin-bottom: 12px; font-size: 1.1rem; }
    .cmd-item {
      background: rgba(128,222,234,0.06); border-radius: 8px;
      padding: 8px 10px; margin-bottom: 8px; font-size: 0.82rem;
    }
    .cmd-item b { color: #4dd0e1; }
    .modal-close {
      margin-top: 12px; width: 100%; padding: 10px;
      background: #006064; color: white; border: none; border-radius: 8px;
      font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="particles"></div>

  <div class="app">
    <h1>me fishgpt</h1>
    <div id="chat"></div>

    <div class="input-area">
      <textarea id="input" placeholder="Bisikkan sesuatu..." rows="1"></textarea>
      <button id="btnKirim">Kirim</button>
    </div>

    <div class="upload-area">
      <label>+ Pengetahuan (.txt)<input type="file" id="fileInput" accept=".txt"></label>
      <label>+ Perintah (.json)<input type="file" id="jsonInput" accept=".json,.txt"></label>
    </div>

    <div class="bottom-row">
      <div id="status">Menunggu koneksi...</div>
      <button class="btn-small" id="btnLihat">Lihat Perintah</button>
      <button class="btn-small" id="btnResetCommands">Reset Perintah</button>
      <button class="btn-small" id="btnResetKnowledge">Reset Pengetahuan</button>
    </div>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h3>Daftar Perintah Aktif</h3>
      <div id="modalList"></div>
      <button class="modal-close" id="btnCloseModal">Tutup</button>
    </div>
  </div>

  <!-- ========== INTEGRASI FISHGPT.JS ========== -->
  <script src="fishgpt.js"></script>

  <script>
    const API = 'https://me-fishgpt-production.up.railway.app';

    const DEFAULT_COMMANDS = {
      version: "2.3",
      name: "Fishgpt Default",
      commands: [
        {
          category: "sapaan",
          triggers: ["halo","hai","hi","hey","hello","pagi","siang","sore","malam"],
          responses: {
            pagi: "pagi... saya fishgpt",
            siang: "siang. saya fishgpt",
            sore: "sore. kedalaman mulai gelap",
            malam: "malam. saya fishgpt dari bawah laut",
            default: "saya fishgpt"
          }
        },
        {
          category: "identitas",
          triggers: ["siapa kamu","kamu siapa","nama kamu"],
          response: "saya fishgpt. makhluk dari kedalaman"
        },
        {
          category: "kabar",
          triggers: ["apa kabar","gimana kabar","kabarmu"],
          response: "tenang. arus sedang pelan hari ini"
        },
        {
          category: "terima kasih",
          triggers: ["terima kasih","makasih","thanks"],
          response: "sama-sama..."
        },
        {
          category: "sedih",
          triggers: ["sedih","capek","lelah"],
          response: "tenggelam sejenak boleh. laut menerimamu"
        },
        {
          category: "senang",
          triggers: ["senang","bahagia","happy"],
          response: "bagus. biarkan itu mengapung"
        },
        {
          category: "belajar",
          triggers: ["belajar","ajari"],
          response: "kirimkan file. aku akan mengingatnya"
        },
        {
          category: "afirmasi",
          triggers: ["ok","oke","baik","sip"],
          response: "baik"
        },
        {
          category: "perpisahan",
          triggers: ["bye","dadah","selamat tinggal"],
          response: "sampai bertemu di arus berikutnya"
        }
      ],
      special_responses: [
        { trigger: "random", response: "dari kedalaman yang sama" }
      ],
      fallback: "me fishgpt"
    };

    let COMMANDS = JSON.parse(localStorage.getItem('fishgpt_commands')) || JSON.parse(JSON.stringify(DEFAULT_COMMANDS));

    function simpanPerintah() {
      localStorage.setItem('fishgpt_commands', JSON.stringify(COMMANDS));
    }

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const btn = document.getElementById('btnKirim');
    const fileInput = document.getElementById('fileInput');
    const jsonInput = document.getElementById('jsonInput');
    const status = document.getElementById('status');
    const btnLihat = document.getElementById('btnLihat');
    const btnResetCommands = document.getElementById('btnResetCommands');
    const btnResetKnowledge = document.getElementById('btnResetKnowledge');
    const modal = document.getElementById('modal');
    const modalList = document.getElementById('modalList');
    const btnCloseModal = document.getElementById('btnCloseModal');

    // ========== FISHGPT INTEGRATION FLAG ==========
    let fishGPTReady = false;
    let fishGPTCommandsLoaded = false;

    // Coba load commands dari FishGPT
    async function initFishGPT() {
      try {
        if (typeof FishGPT !== 'undefined' && FishGPT.loadCommands) {
          await FishGPT.loadCommands();
          fishGPTReady = true;
          fishGPTCommandsLoaded = true;
          status.textContent = 'FishGPT aktif | ' + status.textContent;
          console.log('[FishGPT] Loaded successfully');
        } else {
          console.warn('[FishGPT] Tidak ditemukan, pakai lokal');
        }
      } catch (e) {
        console.warn('[FishGPT] Gagal load:', e.message);
        fishGPTReady = false;
      }
    }

    // Panggil init
    initFishGPT();

    // Particles
    (function() {
      const c = document.getElementById('particles');
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
        p.style.animationDuration = (10 + Math.random() * 14) + 's';
        p.style.animationDelay = Math.random() * 10 + 's';
        c.appendChild(p);
      }
    })();

    // Audio
    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTypeSound() {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = 600 + Math.random() * 140;
      o.type = 'triangle'; g.gain.value = 0.025;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      o.start(); o.stop(audioCtx.currentTime + 0.05);
    }
    function playKeySound() {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = 750 + Math.random() * 300;
      o.type = 'square'; g.gain.value = 0.012;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
      o.start(); o.stop(audioCtx.currentTime + 0.03);
    }
    input.addEventListener('keydown', () => { initAudio(); playKeySound(); });

    // Ripple
    btn.addEventListener('click', function(e) {
      const r = this.getBoundingClientRect();
      const s = document.createElement('span');
      s.className = 'ripple';
      const size = Math.max(r.width, r.height);
      s.style.width = s.style.height = size + 'px';
      s.style.left = (e.clientX - r.left - size/2) + 'px';
      s.style.top = (e.clientY - r.top - size/2) + 'px';
      this.appendChild(s);
      setTimeout(() => s.remove(), 550);
    });

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    }
    input.addEventListener('input', autoResize);

    async function updateStatus() {
      try {
        const res = await fetch(API + '/knowledge/count');
        const data = await res.json();
        const fishStatus = fishGPTReady ? '🐟 ' : '';
        status.textContent = `${fishStatus}Pengetahuan: ${data.count} | Perintah: ${COMMANDS.commands.length}`;
        status.className = 'online';
      } catch {
        status.textContent = 'Backend offline';
        status.className = 'offline';
      }
    }
    updateStatus();

    // Stack JSON
    jsonInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        if (!json.commands || !Array.isArray(json.commands)) {
          alert('JSON tidak valid. Harus ada array "commands".');
          return;
        }
        const sebelum = COMMANDS.commands.length;
        json.commands.forEach(cmd => COMMANDS.commands.push(cmd));
        if (Array.isArray(json.special_responses)) {
          COMMANDS.special_responses = COMMANDS.special_responses || [];
          COMMANDS.special_responses.push(...json.special_responses);
        }
        if (json.fallback) COMMANDS.fallback = json.fallback;
        simpanPerintah();
        status.textContent = `Ditumpuk +${COMMANDS.commands.length - sebelum}. Total: ${COMMANDS.commands.length}`;
        status.className = 'online';
      } catch (err) {
        alert('Gagal membaca JSON: ' + err.message);
      }
      jsonInput.value = '';
    });

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      status.textContent = 'Mengunggah...';
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch(API + '/upload', { method: 'POST', body: fd });
        const data = await res.json();
        status.textContent = res.ok ? data.message : (data.error || 'Gagal');
        if (res.ok) updateStatus();
      } catch {
        status.textContent = 'Gagal terhubung';
        status.className = 'offline';
      }
      fileInput.value = '';
    });

    btnResetKnowledge.addEventListener('click', async () => {
      if (!confirm('Hapus semua pengetahuan di server?')) return;
      try {
        const res = await fetch(API + '/knowledge/reset', { method: 'DELETE' });
        const data = await res.json();
        status.textContent = res.ok ? 'Pengetahuan direset' : (data.error || 'Gagal');
        if (res.ok) updateStatus();
      } catch {
        status.textContent = 'Gagal terhubung';
      }
    });

    btnResetCommands.addEventListener('click', () => {
      if (!confirm('Kembalikan perintah ke default?')) return;
      COMMANDS = JSON.parse(JSON.stringify(DEFAULT_COMMANDS));
      simpanPerintah();
      status.textContent = `Perintah direset (${COMMANDS.commands.length})`;
      status.className = 'online';
    });

    btnLihat.addEventListener('click', () => {
      modalList.innerHTML = '';
      if (COMMANDS.commands.length === 0) {
        modalList.innerHTML = '<div class="cmd-item">Belum ada perintah</div>';
      } else {
        COMMANDS.commands.forEach((cmd, i) => {
          const div = document.createElement('div');
          div.className = 'cmd-item';
          div.innerHTML = `<b>${i+1}. ${cmd.category}</b><br>Trigger: ${cmd.triggers.join(', ')}`;
          modalList.appendChild(div);
        });
      }
      modal.classList.add('active');
    });
    btnCloseModal.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    function ketik(teks, el) {
      let i = 0;
      el.textContent = '';
      function step() {
        if (i < teks.length) {
          el.textContent += teks[i];
          playTypeSound();
          i++;
          chat.scrollTop = chat.scrollHeight;
          setTimeout(step, 38);
        }
      }
      step();
    }

    // ========== LOGIKA UTAMA DENGAN FISHGPT PRIORITAS ==========
    async function pilihJawaban(pesan) {
      // PRIORITAS 1: FishGPT (jika ready)
      if (fishGPTReady && typeof FishGPT !== 'undefined' && FishGPT.chooseAnswer) {
        try {
          const jawaban = await FishGPT.chooseAnswer(pesan);
          if (jawaban && jawaban.text) {
            const type = jawaban.type || 'command';
            return { text: jawaban.text, type: type };
          }
        } catch (e) {
          console.warn('[FishGPT] chooseAnswer error:', e);
        }
      }

      // PRIORITAS 2: Perintah lokal (COMMANDS)
      const p = pesan.toLowerCase().trim();
      const jam = new Date().getHours();

      for (const cmd of COMMANDS.commands) {
        if (!cmd.triggers.some(t => p.includes(t.toLowerCase()))) continue;
        if (cmd.responses) {
          if (p.includes('pagi') || (cmd.category === 'sapaan' && jam >= 5 && jam < 11))
            return { text: cmd.responses.pagi || cmd.responses.default, type: 'command' };
          if (p.includes('siang') || (cmd.category === 'sapaan' && jam >= 11 && jam < 15))
            return { text: cmd.responses.siang || cmd.responses.default, type: 'command' };
          if (p.includes('sore') || (cmd.category === 'sapaan' && jam >= 15 && jam < 18))
            return { text: cmd.responses.sore || cmd.responses.default, type: 'command' };
          if (p.includes('malam') || (cmd.category === 'sapaan' && (jam >= 18 || jam < 5)))
            return { text: cmd.responses.malam || cmd.responses.default, type: 'command' };
          return { text: cmd.responses.default || Object.values(cmd.responses)[0], type: 'command' };
        }
        if (cmd.response) return { text: cmd.response, type: 'command' };
      }

      // PRIORITAS 3: Special random (3%)
      if (Math.random() < 0.03) {
        return { text: "dari kedalaman yang sama", type: 'special' };
      }

      // PRIORITAS 4: Pengetahuan dari server
      try {
        const res = await fetch(API + '/knowledge/random');
        const data = await res.json();
        if (data.content) return { text: data.content, type: 'learned' };
      } catch {}

      // PRIORITAS 5: Fallback
      return { text: COMMANDS.fallback || 'me fishgpt', type: 'normal' };
    }

    async function kirim() {
      const pesan = input.value.trim();
      if (!pesan) return;
      initAudio();

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.textContent = 'Kamu: ' + pesan;
      chat.appendChild(userDiv);
      chat.scrollTop = chat.scrollHeight;

      input.value = '';
      input.style.height = '44px';

      const botDiv = document.createElement('div');
      botDiv.className = 'msg bot';
      chat.appendChild(botDiv);

      const j = await pilihJawaban(pesan);
      if (j.type === 'special') botDiv.classList.add('special');
      if (j.type === 'learned') botDiv.classList.add('learned');
      if (j.type === 'command') botDiv.classList.add('command');

      ketik(j.text, botDiv);
    }

    btn.addEventListener('click', kirim);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        kirim();
      }
    });

    setTimeout(autoResize, 50);
  </script>
</body>
</html>
