<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>me fishgpt</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Quicksand', system-ui, sans-serif;
      background: linear-gradient(to bottom, #020b18 0%, #041428 45%, #0a2a4a 100%);
      color: #e0f7fa;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    body::before {
      content: ''; position: absolute; top: -20%; left: 50%;
      width: 110%; height: 45%;
      background: radial-gradient(ellipse, rgba(100,200,255,0.07) 0%, transparent 70%);
      transform: translateX(-50%); pointer-events: none; z-index: 0;
    }
    body::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%);
      pointer-events: none; z-index: 3;
    }
    .app {
      width: 100%; max-width: 480px; height: 100%; max-height: 820px;
      display: flex; flex-direction: column;
      padding: 18px; position: relative; z-index: 10;
    }
    h1 {
      font-size: 1.5rem; font-weight: 600; letter-spacing: 4px;
      color: #80deea; text-shadow: 0 0 14px rgba(128,222,234,0.55);
      margin-bottom: 4px; text-align: center;
    }
    h1::after {
      content: ''; display: block; width: 56px; height: 2px; margin: 7px auto 0;
      background: linear-gradient(90deg, transparent, #80deea, transparent); opacity: 0.6;
    }
    #chat {
      width: 100%;
      flex: 1;
      min-height: 200px;
      max-height: 500px;
      border: 1px solid rgba(128,222,234,0.2);
      border-radius: 18px;
      padding: 16px;
      overflow-y: auto;
      margin: 12px 0;
      box-shadow: 0 10px 36px rgba(0,0,0,0.4);
      position: relative;
      word-wrap: break-word;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      background-image:
        linear-gradient(rgba(8,28,48,0.78), rgba(8,28,48,0.78)),
        url('Screenshot_20260821-130756_Brave.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    #chat:empty::before {
      content: 'Kedalaman menunggu bisikanmu...';
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(128,222,234,0.35); font-size: 0.95rem; white-space: nowrap;
      pointer-events: none;
      z-index: 5;
    }
    .msg {
      margin-bottom: 11px;
      line-height: 1.5;
      max-width: 88%;
      font-size: 0.97rem;
      word-wrap: break-word;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      position: relative;
      z-index: 6;
    }
    .user {
      color: #90caf9;
      margin-left: auto;
      text-align: right;
    }
    .bot {
      color: #80deea;
      text-shadow: 0 0 8px rgba(128,222,234,0.4);
    }
    .bot.special { color: #f0abfc; text-shadow: 0 0 10px rgba(240,171,252,0.5); }
    .bot.learned { color: #a5f3fc; }

    .input-area {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: flex-end;
    }
    .input-area textarea {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid rgba(128,222,234,0.25);
      border-radius: 12px;
      background: rgba(10,35,55,0.7);
      color: #e0f7fa;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      resize: none;
      overflow-y: auto;
      min-height: 48px;
      max-height: 120px;
      line-height: 1.4;
      transition: height 0.1s ease;
    }
    .input-area textarea::placeholder {
      color: rgba(128,222,234,0.4);
    }
    button {
      padding: 13px 18px;
      background: linear-gradient(135deg, #006064, #00acc1);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      height: 48px;
      flex-shrink: 0;
    }
    .upload-area {
      width: 100%;
      margin-top: 2px;
    }
    .upload-area label {
      display: block;
      padding: 10px;
      text-align: center;
      border: 1px dashed rgba(128,222,234,0.35);
      border-radius: 10px;
      color: rgba(128,222,234,0.7);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .upload-area input[type="file"] { display: none; }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    #status {
      font-size: 0.78rem;
      color: rgba(128,222,234,0.5);
      flex: 1;
    }
    #btnReset {
      padding: 6px 16px;
      background: rgba(255,60,60,0.2);
      color: #ff8a80;
      border: 1px solid rgba(255,60,60,0.35);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    #btnReset:hover {
      background: rgba(255,60,60,0.4);
      border-color: #ff5252;
      color: #ffab91;
    }
    #btnReset:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>me fishgpt</h1>
    <div id="chat"></div>

    <div class="input-area">
      <textarea id="input" placeholder="Bisikkan sesuatu..." autocomplete="off" rows="1"></textarea>
      <button id="btnKirim">Kirim</button>
    </div>

    <div class="upload-area">
      <label>
        + Beri Pengetahuan (.txt)
        <input type="file" id="fileInput" accept=".txt" />
      </label>
    </div>

    <div class="bottom-row">
      <div id="status">Menunggu koneksi...</div>
      <button id="btnReset">🗑️ Reset Pengetahuan</button>
    </div>
  </div>

  <script>
    const API = 'https://me-fishgpt-production.up.railway.app';

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const btn = document.getElementById('btnKirim');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const btnReset = document.getElementById('btnReset');

    // ========== AUDIO ==========
    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTypeSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 620 + Math.random() * 180;
      osc.type = 'triangle';
      gain.gain.value = 0.035;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    }

    // ========== AUTO-RESIZE TEXTAREA ==========
    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }
    input.addEventListener('input', autoResize);

    // ========== STATUS ==========
    async function updateStatus() {
      try {
        const res = await fetch(API + '/knowledge/count');
        const data = await res.json();
        status.textContent = `Pengetahuan bersama: ${data.count} potongan`;
      } catch {
        status.textContent = 'Backend offline';
      }
    }
    updateStatus();

    // ========== UPLOAD ==========
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      status.textContent = 'Mengunggah...';
      const formData = new FormData();
      formData.append('file', file);
      try {
        const res = await fetch(API + '/upload', { method: 'POST', body: formData });
        const data = await res.json();
        status.textContent = res.ok ? data.message : (data.error || 'Gagal');
        if (res.ok) updateStatus();
      } catch {
        status.textContent = 'Gagal terhubung';
      }
      fileInput.value = '';
    });

    // ========== RESET PENGETAHUAN ==========
    btnReset.addEventListener('click', async () => {
      if (!confirm('Yakin mau hapus semua pengetahuan? Ini ga bisa dibalikin.')) return;
      status.textContent = 'Menghapus semua pengetahuan...';
      try {
        const res = await fetch(API + '/knowledge/reset', { method: 'DELETE' });
        const data = await res.json();
        status.textContent = res.ok ? '✅ Semua pengetahuan direset' : (data.error || 'Gagal reset');
        if (res.ok) updateStatus();
      } catch {
        status.textContent = 'Gagal terhubung ke backend';
      }
    });

    // ========== KETIK EFEK ==========
    function ketik(teks, elemen) {
      let i = 0;
      elemen.textContent = '';
      function step() {
        if (i < teks.length) {
          elemen.textContent += teks[i];
          playTypeSound();
          i++;
          chat.scrollTop = chat.scrollHeight;
          setTimeout(step, 45);
        }
      }
      step();
    }

    // ========== LOGIKA SEDERHANA ==========
    function logikaSederhana(pesan) {
      const p = pesan.toLowerCase().trim();
      if (/^(halo|hai|hi|hey|hello|pagi|siang|sore|malam)\b/.test(p)) {
        const jam = new Date().getHours();
        if (jam >= 5 && jam < 11) return 'pagi... saya fishgpt';
        if (jam >= 11 && jam < 15) return 'siang. saya fishgpt';
        if (jam >= 15 && jam < 19) return 'sore. kedalaman mulai gelap';
        return 'malam. saya fishgpt dari bawah laut';
      }
      if (p.includes('siapa kamu') || p.includes('kamu siapa') || p.includes('nama kamu')) {
        return 'saya fishgpt. makhluk dari kedalaman';
      }
      if (p.includes('apa kabar') || p.includes('gimana kabar') || p.includes('kabarmu')) {
        return 'tenang. arus sedang pelan hari ini';
      }
      if (p.includes('terima kasih') || p.includes('makasih') || p.includes('thanks')) {
        return 'sama-sama...';
      }
      if (p.includes('love') || p.includes('cinta') || p.includes('sayang')) {
        return 'di laut, perasaan ikut arus';
      }
      if (p.includes('sedih') || p.includes('capek') || p.includes('lelah')) {
        return 'tenggelam sejenak boleh. laut menerimamu';
      }
      if (p.includes('senang') || p.includes('bahagia') || p.includes('happy')) {
        return 'bagus. biarkan itu mengapung';
      }
      if (p.includes('nama saya') || p.includes('namaku') || p.includes('saya')) {
        return 'aku dengarkan';
      }
      if (p.includes('apa yang kamu tahu') || p.includes('pengetahuan')) {
        return 'aku menyimpan apa yang diberikan padaku';
      }
      if (p.includes('belajar') || p.includes('ajari')) {
        return 'kirimkan file. aku akan mengingatnya';
      }
      if (p === 'ok' || p === 'oke' || p === 'baik' || p === 'sip') {
        return 'baik';
      }
      if (p.includes('bye') || p.includes('dadah') || p.includes('selamat tinggal')) {
        return 'sampai bertemu di arus berikutnya';
      }
      return null;
    }

    // ========== PILIH JAWABAN ==========
    async function pilihJawaban(pesanUser) {
      const sederhana = logikaSederhana(pesanUser);
      if (sederhana) return { text: sederhana, type: 'normal' };

      const rand = Math.random();
      if (rand < 0.08) {
        return { text: "i'm gpt by VelvetEcho ON MoonVibes", type: 'special' };
      }
      if (rand < 0.53) {
        try {
          const res = await fetch(API + '/knowledge/random');
          const data = await res.json();
          if (data.content) {
            return { text: data.content, type: 'learned' };
          }
        } catch {}
      }
      return { text: 'me fishgpt', type: 'normal' };
    }

    // ========== KIRIM ==========
    async function kirim() {
      const pesan = input.value.trim();
      if (!pesan) return;

      initAudio();

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.textContent = 'Kamu: ' + pesan;
      chat.appendChild(userDiv);
      chat.scrollTop = chat.scrollHeight;

      input.value = '';
      input.style.height = '48px';

      const botDiv = document.createElement('div');
      botDiv.className = 'msg bot';
      chat.appendChild(botDiv);

      const jawaban = await pilihJawaban(pesan);
      if (jawaban.type === 'special') botDiv.classList.add('special');
      if (jawaban.type === 'learned') botDiv.classList.add('learned');

      ketik(jawaban.text, botDiv);
    }

    btn.addEventListener('click', kirim);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        kirim();
      }
    });

    setTimeout(autoResize, 100);
  </script>
</body>
</html>
