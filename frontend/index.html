<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>me fishgpt</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Quicksand', system-ui, sans-serif;
      background: linear-gradient(to bottom, #020b18 0%, #041428 45%, #0a2a4a 100%);
      color: #e0f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: -20%; left: 50%;
      width: 110%; height: 45%;
      background: radial-gradient(ellipse, rgba(100, 200, 255, 0.07) 0%, transparent 70%);
      transform: translateX(-50%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
      pointer-events: none; z-index: 3;
    }
    .app {
      width: 100%; max-width: 480px; height: 100%; max-height: 780px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; position: relative; z-index: 10;
    }
    h1 {
      font-size: 1.55rem; font-weight: 600; letter-spacing: 4px;
      color: #80deea; text-shadow: 0 0 14px rgba(128,222,234,0.55);
      margin-bottom: 6px;
    }
    h1::after {
      content: ''; display: block; width: 60px; height: 2px; margin: 8px auto 0;
      background: linear-gradient(90deg, transparent, #80deea, transparent); opacity: 0.6;
    }
    #chat {
      width: 100%; height: 300px; min-height: 300px; max-height: 300px;
      border: 1px solid rgba(128,222,234,0.2); border-radius: 18px;
      padding: 16px; overflow-y: auto; margin: 14px 0;
      box-shadow: 0 10px 36px rgba(0,0,0,0.4); position: relative;
      background-image:
        linear-gradient(rgba(8,28,48,0.78), rgba(8,28,48,0.78)),
        url('Screenshot_20260821-130756_Brave.png');
      background-size: cover; background-position: center;
    }
    #chat:empty::before {
      content: 'Kedalaman menunggu bisikanmu...';
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(128,222,234,0.35); font-size: 0.95rem; white-space: nowrap;
    }
    .msg { margin-bottom: 12px; line-height: 1.5; max-width: 88%; }
    .user { color: #90caf9; margin-left: auto; text-align: right; }
    .bot { color: #80deea; text-shadow: 0 0 8px rgba(128,222,234,0.4); }
    .bot.special { color: #f0abfc; text-shadow: 0 0 10px rgba(240,171,252,0.5); }
    .bot.learned { color: #a5f3fc; }

    .input-area { width: 100%; display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"] {
      flex: 1; padding: 13px 15px;
      border: 1px solid rgba(128,222,234,0.25); border-radius: 12px;
      background: rgba(10,35,55,0.7); color: #e0f7fa; font-size: 1rem;
      font-family: inherit; outline: none;
    }
    button {
      padding: 13px 18px; background: linear-gradient(135deg, #006064, #00acc1);
      color: white; border: none; border-radius: 12px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer;
    }

    .upload-area {
      width: 100%; display: flex; gap: 8px; align-items: center;
      margin-top: 4px;
    }
    .upload-area label {
      flex: 1; padding: 10px; text-align: center;
      border: 1px dashed rgba(128,222,234,0.35); border-radius: 10px;
      color: rgba(128,222,234,0.7); font-size: 0.9rem; cursor: pointer;
    }
    .upload-area input[type="file"] { display: none; }
    #status {
      font-size: 0.8rem; color: rgba(128,222,234,0.5); margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>me fishgpt</h1>
    <div id="chat"></div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Bisikkan sesuatu..." autocomplete="off">
      <button id="btnKirim">Kirim</button>
    </div>

    <div class="upload-area">
      <label>
        + Beri Pengetahuan (.txt)
        <input type="file" id="fileInput" accept=".txt">
      </label>
    </div>
    <div id="status">Menunggu koneksi...</div>
  </div>

  <script>
    // ================== GANTI URL INI ==================
    const API = 'https://me-fishgpt-production.up.railway.app';
    // ==================================================

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const btn = document.getElementById('btnKirim');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');

    // Cek jumlah pengetahuan
    async function updateStatus() {
      try {
        const res = await fetch(API + '/knowledge/count');
        const data = await res.json();
        status.textContent = `Pengetahuan bersama: ${data.count} potongan`;
      } catch {
        status.textContent = 'Backend offline / belum terhubung';
      }
    }
    updateStatus();

    // Upload file
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      status.textContent = 'Mengunggah pengetahuan...';
      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(API + '/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          status.textContent = data.message;
          updateStatus();
        } else {
          status.textContent = data.error || 'Gagal upload';
        }
      } catch {
        status.textContent = 'Gagal terhubung ke server';
      }
      fileInput.value = '';
    });

    // Ketik efek
    function ketik(teks, elemen) {
      let i = 0;
      elemen.textContent = '';
      function step() {
        if (i < teks.length) {
          elemen.textContent += teks[i];
          i++;
          chat.scrollTop = chat.scrollHeight;
          setTimeout(step, 55);
        }
      }
      step();
    }

    // Pilih jawaban
    async function pilihJawaban() {
      const rand = Math.random();

      // 12% spesial
      if (rand < 0.12) {
        return { text: "i'm gpt by VelvetEcho ON MoonVibes", type: 'special' };
      }

      // 35% coba ambil dari pengetahuan
      if (rand < 0.47) {
        try {
          const res = await fetch(API + '/knowledge/random');
          const data = await res.json();
          if (data.content) {
            return { text: data.content, type: 'learned' };
          }
        } catch {}
      }

      // Sisanya
      return { text: 'me fishgpt', type: 'normal' };
    }

    async function kirim() {
      const pesan = input.value.trim();
      if (!pesan) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.textContent = 'Kamu: ' + pesan;
      chat.appendChild(userDiv);
      chat.scrollTop = chat.scrollHeight;
      input.value = '';

      const botDiv = document.createElement('div');
      botDiv.className = 'msg bot';
      chat.appendChild(botDiv);

      const jawaban = await pilihJawaban();
      if (jawaban.type === 'special') botDiv.classList.add('special');
      if (jawaban.type === 'learned') botDiv.classList.add('learned');

      ketik(jawaban.text, botDiv);
    }

    btn.addEventListener('click', kirim);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') kirim();
    });
  </script>
</body>
  </html>
